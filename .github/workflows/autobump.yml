# brew tap-new uses this file to generate an autobump workflow for the new tap
name: brew bump

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/autobump.yml
  schedule:
    # Every day at 23:30 UTC
    - cron: 30 23 * * *

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  autobump:
    runs-on: macos-26
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@2026.10.19.1

      - name: Set up git
        id: git_setup
        uses: Homebrew/actions/git-user-config@2026.10.19.1

      - name: Bump formulae and casks
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GIT_COMMITTER_NAME: ${{ steps.git_setup.outputs.name }}
          HOMEBREW_GIT_COMMITTER_EMAIL: ${{ steps.git_setup.outputs.email }}
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
        run: brew bump --no-fork --open-pr --bump-synced --tap="$TAP_NAME"

      - name: Assign update pull requests
        if: ${{ !cancelled() }}
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pull_requests="$(gh api --paginate "repos/$GH_REPO/pulls?state=open&per_page=100" \
            --jq '.[] | select(.head.ref | startswith("bump-")) | .number')"
          for pull_request in $pull_requests; do
            gh pr edit "$pull_request" --add-assignee "${GH_REPO%%/*}"
          done
